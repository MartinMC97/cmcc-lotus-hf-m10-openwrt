name: Build HF-M10 firmware

on:
  workflow_dispatch:
    inputs:
      include_userdata:
        description: Include empty Userdata images for first installation (erases data if flashed)
        type: boolean
        default: true
  push:
    branches:
      - cmcc-lotus-hf-m10-25.12
    paths:
      - .github/workflows/build-hf-m10.yml
      - configs/cmcc-lotus-hf-m10.config
      - contrib/hf-m10/**
      - docs/hf-m10/FLASHING.md
      - feeds.conf.default
      - package/cmcc-lotus-hf-m10/**
      - scripts/cmcc-lotus-hf-m10/**
      - target/linux/generic/**
      - target/linux/rockchip/**
      - tests/hf-m10/**
      - tools/hf-m10-resource/**
      - vendor/hf-m10/**

permissions:
  contents: read

concurrency:
  group: hf-m10-firmware-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h "$GITHUB_WORKSPACE"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake bc binutils bison build-essential clang cmake cpio curl \
            e2fsprogs file flex g++ g++-multilib gawk gcc-multilib gettext git \
            help2man libelf-dev libncurses-dev libssl-dev libtool-bin meson \
            ninja-build patch pkg-config python3 python3-dev python3-pyelftools \
            python3-setuptools rsync subversion swig texinfo time unzip wget \
            xsltproc xxd xz-utils zlib1g-dev zstd

      - name: Test board scripts and build patched U-Boot
        run: |
          mkdir -p artifacts/ci build-logs
          for test in tests/hf-m10/test-*.py; do
            python3 "$test"
          done
          python3 contrib/hf-m10/build-uboot-no-recovery.py \
            --input vendor/hf-m10/uboot-stock.img --output artifacts/ci/uboot

      - name: Restore source download cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: dl
          key: hf-m10-dl-v1-${{ runner.os }}-${{ hashFiles('feeds.conf.default', 'configs/cmcc-lotus-hf-m10.config', 'target/linux/generic/kernel-6.12', 'package/cmcc-lotus-hf-m10/**/Makefile') }}
          restore-keys: hf-m10-dl-v1-${{ runner.os }}-

      - name: Install pinned feeds and select HF-M10
        run: |
          set -o pipefail
          ./scripts/feeds update -a 2>&1 | tee build-logs/feeds-update.log
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          provenance = json.loads(Path('docs/hf-m10/provenance.json').read_text())
          for feed in ('packages', 'luci'):
              actual = subprocess.check_output(['git', '-C', 'feeds/' + feed, 'rev-parse', 'HEAD'], text=True).strip()
              if actual != provenance[feed + '_commit']:
                  raise SystemExit('Unexpected feed revision: ' + feed)
          PY
          ./scripts/feeds install -a 2>&1 | tee build-logs/feeds-install.log
          cp configs/cmcc-lotus-hf-m10.config .config
          make defconfig 2>&1 | tee build-logs/defconfig.log
          for option in \
            CONFIG_TARGET_rockchip_hf_m10_DEVICE_cmcc-lotus-hf-m10 \
            CONFIG_PACKAGE_cmcc-lotus-hf-m10-console \
            CONFIG_PACKAGE_cmcc-lotus-hf-m10-direct-root \
            CONFIG_PACKAGE_luci-ssl; do
            grep -qx "${option}=y" .config
          done
          cp .config artifacts/ci/build.config
          ./scripts/diffconfig.sh > artifacts/ci/config.seed

      - name: Download verified sources
        run: |
          set -o pipefail
          make download -j4 2>&1 | tee build-logs/download.log

      - name: Build native toolchain, kernel and Rootfs
        run: |
          set -o pipefail
          make -j2 V=s 2>&1 | tee build-logs/world.log

      - name: Verify and package flash images
        id: package
        env:
          INCLUDE_USERDATA: ${{ github.event_name != 'workflow_dispatch' || inputs.include_userdata }}
        run: |
          args=()
          if [[ "$INCLUDE_USERDATA" == true ]]; then
            args+=(--include-userdata)
          fi
          python3 scripts/cmcc-lotus-hf-m10/package_firmware.py \
            --images bin/targets/rockchip/hf_m10 --uboot artifacts/ci/uboot \
            --config artifacts/ci/build.config --seed artifacts/ci/config.seed \
            --output artifacts/ci/firmware "${args[@]}"
          (cd artifacts/ci/firmware && sha256sum -c SHA256SUMS)
          short_sha="$(git rev-parse --short=12 HEAD)"
          echo "name=hf-m10-25.12.5-${short_sha}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          {
            echo '## HF-M10 firmware'
            echo
            echo "Source: \`$(git rev-parse HEAD)\`"
            echo
            echo '* upgrade/: paired 17 MiB Boot + 35 MiB Rootfs with USB CDC ACM login.'
            echo '* maintenance/uboot/: volume-up + USB Loader, no-Recovery U-Boot.'
            echo '* first-install/: optional empty Userdata images; never use for upgrades.'
            echo '* README.md: image addresses, device-specific GPT preparation and flashing sequence.'
            echo '* Checks passed offline; hardware acceptance is not performed by Actions.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verified firmware bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.package.outputs.name }}
          path: artifacts/ci/firmware/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Upload build logs and configuration
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hf-m10-build-logs-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            build-logs/
            artifacts/ci/build.config
            artifacts/ci/config.seed
          if-no-files-found: ignore
          retention-days: 14
