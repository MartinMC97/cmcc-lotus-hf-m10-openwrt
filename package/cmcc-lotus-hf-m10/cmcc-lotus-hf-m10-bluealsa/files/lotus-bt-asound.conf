defaults.pcm.rate_converter "linear"
pcm.lotus_bt_hw {
    type hw
    card 0
    device 0
}
pcm.lotus_bt {
    type plug
    slave {
        pcm "lotus_bt_quiet"
        format S16_LE
        rate 48000
        channels 2
    }
}
pcm.lotus_bt_quiet {
    type route
    slave {
        pcm "lotus_bt_hw"
        format S16_LE
        channels 2
    }
    # Gain accepted in the previous physical playback test; never use unity here.
    ttable.0.0 0.15
    ttable.1.1 0.15
}
